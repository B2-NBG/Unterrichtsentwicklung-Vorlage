# Bauen und zustellen: Nach jedem Push auf main prüft GitHub die Änderungen, erneuert Handbuch und Test-Vorschau (und
# committet sie), baut Lernpakete und Kurse aus ihren Quellen und schickt alles an den Flow (Power Automate), der es in
# den Teamordner BYCS-SYNC legt. Ersetzt die früheren Git-Hooks: Kein Rechner kopiert oder erneuert selbst.
# Ist die Prüfung rot, wird nichts zugestellt. Verglichen wird mit dem letzten grünen Lauf nach einem Push: Was ein
# roter Lauf nicht zugestellt hat, holt der nächste grüne nach.
# Von Hand: Actions > "Bauen und zustellen" > Run workflow (Themenordner, Test-Ordner, Kurs, Kurse, Handbuch oder "alle").
# Schutz (wer was darf, Freigabe, Zurückhalten, Lauf von Hand): .agents/gemeinsam/regeln/schutz-admin.md. Der Workflow liefert dafür BYCS_PUSHES, TEAM_TOKEN und zurueckgehalten.txt.
# Vor dem Push sperrt GitHub selbst (Rulesets aus schutz.txt, auch diese Datei): Der Schritt "Rulesets passen zu
# schutz.txt?" (schutz-github.py --pruefen, liest mit dem GITHUB_TOKEN) hält alles an, wenn sie fehlen oder abweichen.
# Secrets liegen im Environment "zustellung", das nur main nutzen darf (ein Lauf von einem anderen Branch bekommt sie
# nicht): FLOW_URL, FLOW_SCHLUESSEL (Flow), BYCS_LINKSEITE (Download-Links für den Kursbau), TEAM_APP_ID, TEAM_APP_KEY
# (GitHub-App der Organisation, liest nur die Mitglieder der Teams: Werkzeugschutz und Abteilungsschutz in pruefen.py).
# Einstellung: Settings > Actions > General > Workflow permissions: "Read and write" (für den Commit des Handbuchs).
# Pushes mit dem GITHUB_TOKEN lösen keinen neuen Lauf aus: Der Commit des Handbuchs erzeugt keine Schleife.
name: Bauen und zustellen

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      was:
        description: 'Was, mehrere durch Leerzeichen getrennt: Themenordner (Unterricht/<Klasse>/<Fach>/<Abschnitt>/<Thema>), Test-Ordner (Unterricht/…/Test-<Thema>), Kurs (Name wie Kurs-ALLE10-PuG), Kurse, Handbuch, oder: alle'
        required: true
        type: string
      probe:
        description: 'Probe: unter Pakete/_Pilot/, Kurse/_Pilot/ oder Tests/_Pilot/ ablegen (nichts in der ByCS wird berührt)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: paket-zustellen
  cancel-in-progress: false

jobs:
  zustellen:
    runs-on: ubuntu-latest
    environment: zustellung
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0

      - name: Seit wann? (letzter grüner Lauf nach einem Push)
        if: github.event_name == 'push'
        id: basis
        env:
          GH_TOKEN: ${{ github.token }}
          VORHER: ${{ github.event.before }}
        run: |
          # Fail-closed: Liest GitHub die früheren Läufe nicht (vollständig), wird der Lauf rot, statt Pushes falsch zuzuordnen.
          stopp() { echo "::error::$1 Es wird nichts zugestellt. Lösung: den Lauf wiederholen (Re-run jobs). Gibt es unter den 100 neuesten Läufen keinen grünen, hilft nur ein Lauf von Hand der Werkzeug-Verantwortlichen."; exit 1; }
          basis=$(gh run list --workflow paket-zustellen.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""') \
            || stopp "GitHub hat den letzten grünen Lauf nicht geliefert."
          # Noch nie grün (neues Repo, auch nach roten Läufen): mit dem ersten Commit vergleichen, nie mit einem roten Push.
          # Davor galt nie ein Schutz. Grüner Lauf auf einem unbekannten Commit: mit dem Stand vor diesem Push.
          wurzel=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          if [ -z "$basis" ]; then basis="$wurzel"
          elif ! git cat-file -e "$basis^{commit}" 2>/dev/null; then basis="$VORHER"; fi
          if ! git cat-file -e "$basis^{commit}" 2>/dev/null; then basis="$wurzel"; fi
          echo "Verglichen wird mit $basis"
          echo "seit=$basis" >> "$GITHUB_OUTPUT"
          # Pushes seit dem letzten grünen Lauf, älteste zuerst: "<Commit>:<wer gepusht hat>" (für den Schutz in pruefen.py).
          # Kein grüner Lauf unter den 100 neuesten, obwohl es mehr gibt: Die Liste wäre unvollständig, also rot.
          pushes=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/paket-zustellen.yml/runs?branch=main&event=push&per_page=100" --jq '.total_count as $n | (.workflow_runs | length) as $l | [.workflow_runs[] | select(.run_number < '"$GITHUB_RUN_NUMBER"')] | (map(.conclusion) | index("success")) as $i | if $i == null and $n > $l then error("unvollständig") else .[0:($i // length)] | reverse | map(.head_sha + ":" + .actor.login) | join(" ") end') \
            || stopp "GitHub hat die früheren Läufe nicht vollständig geliefert (wer was gepusht hat), der Schutz kann sie nicht zuordnen."
          echo "Frühere Pushes seit dem letzten grünen Lauf: ${pushes:-keine}"
          echo "pushes=$pushes" >> "$GITHUB_OUTPUT"

      # Schulprofil (schule.txt): Schutz "teams" oder "aus" (eine Lehrkraft allein), Zustellung "power-automate" oder
      # "download". Den Schutz in der Fassung des letzten grünen Laufs (wie schutz.txt): Ein Push kann ihn nicht für sich
      # selbst abschalten. Im Zweifel (kein Profil, unlesbar) gilt er.
      - name: Schulprofil (Schutz und Zustellung)
        id: profil
        env:
          SEIT: ${{ steps.basis.outputs.seit }}
        run: |
          schutz=$(git show "${SEIT:-HEAD}:.agents/gemeinsam/data/schule.txt" 2>/dev/null | python3 -c "
          import sys; sys.path.insert(0, '.agents/gemeinsam/scripts'); import profil
          w = [v for k, v, _ in profil.zerlegen(sys.stdin.read()) if k == 'Schutz']
          print('aus' if w and w[0][:1] == ['aus'] else 'teams')" 2>/dev/null) || schutz=teams
          [ "$schutz" = aus ] || schutz=teams
          zustellung=$(python3 .agents/gemeinsam/scripts/profil.py --wert Zustellung)
          echo "Schutz: $schutz, Zustellung: ${zustellung:-power-automate}"
          echo "schutz=$schutz" >> "$GITHUB_OUTPUT"
          echo "zustellung=${zustellung:-power-automate}" >> "$GITHUB_OUTPUT"

      # Zugang zum Lesen der Teams. Scheitert er (Secrets fehlen, App entfernt), meldet pruefen.py den Fehler verständlich.
      - name: Zugang zu den Teams (GitHub-App)
        if: steps.profil.outputs.schutz == 'teams'
        id: teams
        continue-on-error: true
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547   # v1.12.0
        with:
          app-id: ${{ secrets.TEAM_APP_ID }}
          private-key: ${{ secrets.TEAM_APP_KEY }}
          owner: ${{ github.repository_owner }}

      # Sperrt GitHub, was laut schutz.txt gesperrt sein soll? Sonst nichts zustellen (auch ohne Zugang: rot).
      - name: Rulesets passen zu schutz.txt?
        if: steps.profil.outputs.schutz == 'teams'
        env:
          SCHUTZ_TOKEN: ${{ github.token }}
        run: python3 .agents/gemeinsam/scripts/schutz-github.py --pruefen

      - name: Von Hand nur für Werkzeug-Verantwortliche
        if: github.event_name == 'workflow_dispatch'
        env:
          TEAM_TOKEN: ${{ steps.teams.outputs.token }}
        run: python3 .agents/gemeinsam/scripts/pruefen.py --von-hand

      - name: Prüfen, Handbuch und Vorschau erneuern
        if: github.event_name == 'push'
        env:
          TEAM_TOKEN: ${{ steps.teams.outputs.token }}
          BYCS_PUSHES: ${{ steps.basis.outputs.pushes }}
        run: python3 .agents/gemeinsam/scripts/pruefen.py --seit "${{ steps.basis.outputs.seit }}" --erneuern --zurueckhalten "$RUNNER_TEMP/zurueckgehalten.txt"

      - name: Erneuertes committen
        if: github.event_name == 'push'
        env:
          SEIT: ${{ steps.basis.outputs.seit }}
          TEAM_TOKEN: ${{ steps.teams.outputs.token }}
          BYCS_PUSHES: ${{ steps.basis.outputs.pushes }}
        run: |
          # Auch ohne eine einzige Vorschau.html im Repo (git add bricht bei einem Muster ohne Treffer ab)
          vormerken() { git add -A -- '#Handbuch.html'; git ls-files -z -m -d -o --exclude-standard -- ':(glob)Unterricht/**/Vorschau.html' | xargs -0 -r git add -A --; }
          vormerken
          if git diff --cached --quiet; then echo "Nichts zu committen."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Automatisch: Handbuch und Vorschau erneuert [intern]"
          for i in 1 2 3; do
            if git pull --rebase --quiet origin main && git push --quiet origin HEAD:main; then exit 0; fi
            # Jemand hat inzwischen gepusht: auf den neuen Stand setzen, neu prüfen und neu erzeugen
            git rebase --abort 2>/dev/null || true
            git reset --quiet --hard origin/main
            python3 .agents/gemeinsam/scripts/pruefen.py --seit "$SEIT" --erneuern --zurueckhalten "$RUNNER_TEMP/zurueckgehalten.txt" || exit 1
            vormerken
            if git diff --cached --quiet; then exit 0; fi
            git commit -qm "Automatisch: Handbuch und Vorschau erneuert [intern]"
          done
          echo "::error::Handbuch und Vorschau konnten nicht nach main gepusht werden (viele gleichzeitige Änderungen). Lauf wiederholen (Re-run jobs)."
          exit 1

      - name: Bauen und zustellen
        env:
          FLOW_URL: ${{ secrets.FLOW_URL }}
          FLOW_SCHLUESSEL: ${{ secrets.FLOW_SCHLUESSEL }}
          BYCS_LINKSEITE: ${{ secrets.BYCS_LINKSEITE }}
          WAS: ${{ inputs.was }}
          PROBE: ${{ inputs.probe }}
          SEIT: ${{ steps.basis.outputs.seit }}
          ZUSTELLUNG: ${{ steps.profil.outputs.zustellung }}
        run: |
          set -f
          skript=.agents/skills/baue-lernpaket/scripts/paket-zustellen.py
          # Zustellung "download": in einen Ordner statt an den Flow, danach als Download des Laufs (nächster Schritt)
          if [ "$ZUSTELLUNG" = download ]; then ausgabe="--ausgabe $RUNNER_TEMP/pakete"; else ausgabe=; fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 "$skript" $ausgabe --seit "$SEIT" --ohne "$RUNNER_TEMP/zurueckgehalten.txt"
          else
            if [ "$PROBE" = "true" ]; then probe=--probe; else probe=; fi
            python3 "$skript" $ausgabe $probe $WAS
          fi

      # Nur bei Zustellung "download": Was dieser Lauf gebaut hat (nach einem Push nur das Geänderte; alles: Run workflow
      # mit "alle"), liegt unter Actions > Lauf > Artifacts. GitHub löscht es nach 90 Tagen.
      - name: Pakete zum Herunterladen
        if: always() && steps.profil.outputs.zustellung == 'download'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: Pakete-${{ github.run_number }}
          path: ${{ runner.temp }}/pakete
          if-no-files-found: ignore

      - name: Zurückgehalten?
        if: github.event_name == 'push'
        run: |
          datei="$RUNNER_TEMP/zurueckgehalten.txt"
          if [ -s "$datei" ]; then
            echo "::error::Zurückgehalten, nicht zugestellt: $(tr '\n' ' ' < "$datei")(siehe Fehler im Schritt Prüfen). Alles andere ist zugestellt. Freigeben: ein Mitglied des genannten Teams oder Werkzeug-Verantwortliche sehen die Änderung an und wiederholen den Lauf (Re-run jobs), oder die Änderung wird zurückgenommen."
            exit 1
          fi
          echo "Nichts zurückgehalten."
